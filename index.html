<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>План</title>
<style>body{font:17px/1.5 system-ui,sans-serif;margin:12vh auto;max-width:420px;padding:0 20px;color:#1d2327;background:#f6f4ef}
input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #bbb;width:100%;box-sizing:border-box;margin-top:10px}
button{background:#2f6f5e;color:#fff;border:0}</style></head><body>
<p id="m">Загрузка…</p>
<form id="f" hidden><input id="k" placeholder="Ключ или ссылка с ключом" autocomplete="off"><button>Открыть</button></form>
<script>
(()=>{
const m=document.getElementById('m'),f=document.getElementById('f');
const page=(new URLSearchParams(location.search).get('p')||'plan').replace(/[^a-z]/g,'');
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
function ask(t){m.textContent=t;f.hidden=false;}
async function tryKey(k){   // true — страница открыта, false — ключ не подошёл; Error('net') — сбой сети
 let key;try{key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);}catch(e){return false;}
 let r;try{r=await fetch(page+'.bin',{cache:'no-cache'});}catch(e){throw new Error('net');}
 if(!r.ok)throw new Error('net');
 const b=new Uint8Array(await r.arrayBuffer());
 let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.subarray(0,12)},key,b.subarray(12));}catch(e){return false;}
 try{localStorage.setItem('plankey',k)}catch(e){}
 const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();return true;
}
// ключ из ссылки целиком, из «k=…» или просто 43 знака (лишние пробелы, кавычки, точки не мешают)
const pick=v=>{v=(v||'').trim();const x=v.match(/k=([\w-]{40,})/);if(x)return x[1];const y=v.match(/[\w-]{43}/);return y?y[0]:'';};
async function start(list){   // по очереди: ключ из ссылки, сохранённый в браузере; устаревший сохранённый — стираем
 m.textContent='Загрузка…';f.hidden=true;list=[...new Set(list.filter(Boolean))];
 try{for(const k of list){if(await tryKey(k))return;}}
 catch(e){return ask('Не удалось загрузить страницу: проверьте интернет и нажмите «Открыть».');}
 try{localStorage.removeItem('plankey')}catch(e){}
 ask(list.length?'Ключ не подошёл. Вставьте сюда полную ссылку на план или ключ из неё (после «k=»).':'Нужен ключ: откройте полную ссылку с ключом или вставьте его сюда.');
}
f.onsubmit=e=>{e.preventDefault();start([pick(document.getElementById('k').value)]);};
let saved='';try{saved=localStorage.getItem('plankey')||''}catch(e){}
start([pick(location.hash),saved]);
})();
</script></body></html>
